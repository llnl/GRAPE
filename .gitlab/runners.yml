# This is required for all jobs run by Jacamar (all LC jobs)
.id_tokens:
  id_tokens:
     SITE_ID_TOKEN:
        aud: $CI_SERVER_URL

# Windows doesn't parse the variables correctly, but doesn't need this anyways.
.windows_credential_vars:
  variables:
    GIT_CONFIG_COUNT: 0

# This job should be used with TOSS4 jobs to try to address an authentication issue.
.patch_auth:
  hooks:
    pre_get_sources_script:
      # The git version is based on the user's login configuration, so the
      # credential cache may still be present if the git version is older to 2.31. 
      # We clear the cache here as a workaround for older versions of git.
      - git credential-cache exit

._batch:
  tags: &batch batch

._shell:
  tags: &shell shell

.run_ale3d_windows:
  extends:
    - .windows_credential_vars
  tags:
    - ale3d
    - windows

.run_toss4_batch:
  extends:
    - .id_tokens
    - .patch_auth
  tags:
    - ${TOSS4_CI_PLATFORM}
    - *batch

.run_toss4_shell:
  extends:
    - .id_tokens
    - .patch_auth
  tags:
    - ${TOSS4_CI_PLATFORM}
    - *shell

