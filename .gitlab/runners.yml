# Windows doesn't parse the variables correctly, but doesn't need this anyways.
.windows_credential_vars:
  variables:
    GIT_CONFIG_COUNT: 0

# This job should be used with TOSS4 jobs to try to address an authentication issue.
.patch_auth:
  hooks:
    pre_get_sources_script:
      # The git version is based on the user's login configuration, so the
      # credential cache may still be present if the git version is older to 2.31. 
      # We clear the cache here as a workaround for older versions of git.
      - git credential-cache exit

._batch:
  tags: &batch batch

._shell:
  tags: &shell shell

._rzalastor:
  tags: &rzalastor rzalastor

._rzalastor_group:
  resource_group: ${GITLAB_USER_LOGIN}-RZALASTOR

._rzansel:
  tags: &rzansel rzansel

._rzansel_group:
  resource_group: ${GITLAB_USER_LOGIN}-RZANSEL

._rzansel_group_after_hours:
  resource_group: ${GITLAB_USER_LOGIN}-RZANSEL-LATE

._rzwhippet:
  tags: &rzwhippet rzwhippet

._rzwhippet_group:
  resource_group: ${GITLAB_USER_LOGIN}-RZGENIE

._rzwhippet_group_after_hours:
  resource_group: ${GITLAB_USER_LOGIN}-RZGENIE-LATE

._rztopaz:
  tags: &rztopaz rztopaz

.run_ale3d_windows:
  extends:
    - .windows_credential_vars
  tags:
    - ale3d
    - windows

.run_rzalastor_batch:
  extends:
    - .patch_auth
  tags:
    - *rzalastor
    - *batch

.run_rzalastor_shell:
  extends:
    - .patch_auth
  tags:
    - *rzalastor
    - *shell

.run_rzansel_batch:
  tags:
    - *rzansel
    - *batch

.run_rzansel_shell:
  tags:
    - *rzansel
    - *shell

.run_rzwhippet_batch:
  extends:
    - .patch_auth
  tags:
    - *rzwhippet
    - *batch

.run_rzwhippet_shell:
  extends:
    - .patch_auth
  tags:
    - *rzwhippet
    - *shell

.run_rztopaz_batch:
  extends:
    - .patch_auth
  tags:
    - *rztopaz
    - *batch

.run_rztopaz_shell:
  extends:
    - .patch_auth
  tags:
    - *rztopaz
    - *shell

.run_rzalastor_batch_resource_group:
  extends: [.run_rzalastor_batch, ._rzalastor_group]

.run_rzalastor_shell_resource_group:
  extends: [.run_rzalastor_shell, ._rzalastor_group]

.run_rzansel_batch_exclusive:
  extends: [.run_rzansel_batch, ._rzansel_group]

.run_rzansel_batch_exclusive_after_hours:
  extends: [.run_rzansel_batch, ._rzansel_group_after_hours]

.run_rzansel_shell_exclusive:
  extends: [.run_rzansel_shell, ._rzansel_group]

.run_rzansel_shell_exclusive_after_hours:
  extends: [.run_rzansel_shell, ._rzansel_group_after_hours]

.run_rzwhippet_batch_exclusive:
  extends: [.run_rzwhippet_batch, ._rzwhippet_group]

.run_rzwhippet_batch_exclusive_after_hours:
  extends: [.run_rzwhippet_batch, ._rzwhippet_group_after_hours]

.run_rzwhippet_shell_exclusive:
  extends: [.run_rzwhippet_shell, ._rzwhippet_group]

.run_rzwhippet_shell_exclusive_after_hours:
  extends: [.run_rzwhippet_shell, ._rzwhippet_group_after_hours]
