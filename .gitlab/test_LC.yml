.test_linux:
  script:
    - cd $CI_PROJECT_DIR
    - echo $CI_COMMIT_BRANCH
    - echo $CI_COMMIT_REF_NAME
    - echo $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    - ./grape uv --generateSHAList $CI_COMMIT_BRANCH
    - ./grape test
  artifacts:
    paths:
      - GRAPE_PROJECT_SHA.json

.sleep_1_minute:
  script:
    - sleep 60

.tick_version:
  script:
    - cd $CI_PROJECT_DIR
    - git remote set-url origin "ssh://git@rzgitlab.llnl.gov:7999/GRP/grape.git"
    - ./grape version tick --public=$CI_COMMIT_BRANCH --tag --nocommit
    - git push origin --tags
