include:
  - .gitlab/rules.yml
  - .gitlab/runners.yml
  - .gitlab/test_LC.yml
  - .gitlab/test_Windows.yml

variables:
  GIT_SUBMODULE_STRATEGY: normal

stages:
  - test

merge_train_ticket:
  stage: test
  timeout: 30 minutes 
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "2"
  extends:
    - .do_not_run_on_merge_request_changes_to_update_logs
    - .run_on_merge_request
    - .run_rzgenie_shell
    - .test_linux
  interruptible: true

merge_train:
  stage: test
  timeout: 30 minutes
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "2"
  extends:
    - .run_when_grape_queues_in_merge_train_no_approval
    - .run_rzgenie_shell
    - .test_linux
    - .sleep_1_minute
  interruptible: true

test-Windows:
  stage: test
  timeout: 30 minutes
  variables:
    GIT_DEPTH: "2"
  extends:
    - .run_manually
    - .run_ale3d_windows
    - .test_Windows
  interruptible: false
