.test_linux_fast_core:
  script:
    - cd $CI_PROJECT_DIR
    - ./grape test --workers=4 Branches Bundle Config DeleteBranch ResolveConflicts Review Stash Version

.test_linux_git_workflow:
  script:
    - cd $CI_PROJECT_DIR
    - ./grape test --workers=4 Clone GrapeGit CO Unbundle

.test_linux_workspace_topology:
  script:
    - cd $CI_PROJECT_DIR
    - ./grape test --workers=4 MergeDown NestedSubproject Status GrapeUp

.test_linux_publish:
  script:
    - cd $CI_PROJECT_DIR
    - ./grape test Publish

.tick_version:
  script:
    - cd $CI_PROJECT_DIR
    - git remote set-url origin "ssh://git@rzgitlab.llnl.gov:7999/GRP/grape.git"
    - ./grape version tick --public=$CI_COMMIT_BRANCH --tag --nocommit
    - git push origin --tags

.auto_fail:
  script:
    - exit 1

.auto_pass:
  script:
    - exit 0
