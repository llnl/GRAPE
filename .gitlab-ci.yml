include:
  - .gitlab/rules.yml
  - .gitlab/runners.yml
  - .gitlab/test_LC.yml
  - .gitlab/test_Windows.yml

variables:
  GIT_SUBMODULE_STRATEGY: normal

stages:
  - test

merge_train_ticket:
  stage: test
  timeout: 30 minutes 
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "2"
  extends:
    - .run_on_merge_request_except_on_changes_to_update_logs
    - .run_rzgenie_shell
    - .test_linux
  interruptible: true

merge_train:
  stage: test
  timeout: 30 minutes
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "2"
  extends:
    - .run_on_merge_train_changes_to_update_logs
    - .run_rzgenie_shell
    - .test_linux
  interruptible: true

tag_pushes_to_develop_or_master:
  stage: test
  timeout: 30 minutes
  variables:
    GIT_STRATEGY: clone
  extends:
    - .run_on_push_to_develop_or_master
    - .run_rzgenie_shell
    - .tick_version
  interruptible: false

do_not_push_the_button_before_grape_publish:
  stage: test
  timeout: 30 minutes
  variables:
    GIT_STRATEGY: none
  extends:
    - .run_on_merge_train_if_no_changes_to_update_logs
    - .run_rzgenie_shell
    - .auto_fail
  interruptible: true

# deactivated until we have a gitlab windows runner for grape
test-Windows:
  stage: test
  timeout: 30 minutes
  variables:
    GIT_DEPTH: "2"
  extends:
    - .run_never
    - .run_ale3d_windows
    - .test_Windows
  interruptible: false
